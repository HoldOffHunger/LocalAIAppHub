<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Hub</title>
<link rel="stylesheet" href="/static/hub.css">
</head>
<body>
<nav id="rail" aria-label="Apps">
  <div id="rail-title">App Hub</div>
  <div id="app-list"></div>
  <div id="gpu" title="Who has the graphics card"><span class="chip">GPU</span> <span id="gpu-text">free</span></div>

  <div id="offline" hidden>
    <p id="offline-text"></p>
    <button id="offline-start" class="primary" hidden>Start it</button>
  </div>
</main>
<script src="/static/hub.js"></script>
</body>
</html>
